<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MultiFix | Home Solution &amp; Service Center</title>

  
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            navy: {
              950: '#061526',
              900: '#0a2239',
              800: '#103152',
              700: '#174470',
            },
            brandOrange: {
              500: '#ff5a1f',
              600: '#e04810',
            },
            flipkartBlue: {
              600: '#2874f0',
              700: '#1d5ec9',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Blueprint Grid Background for Compact Hero */
    .hero-grid-bg {
      background-color: #082038;
      background-image: 
        radial-gradient(circle at 18% 35%, rgba(14, 116, 144, 0.45) 0%, transparent 55%),
        radial-gradient(circle at 82% 60%, rgba(2, 132, 199, 0.35) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
    }

    /* Fix #1: Clean non-overlapping slide transitions using display block/none + keyframe fade */
    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hero-slide {
      display: none;
    }
    .hero-slide.active {
      display: block;
      animation: slideFadeIn 0.45s ease-out forwards;
    }

    /* Feedback card smooth transition */
    .feedback-fade {
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    /* Custom subtle card hover */
    .hover-lift {
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }
    .hover-lift:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 28px -10px rgba(8, 32, 56, 0.14);
    }

    /* Hide scrollbar for horizontal reel row on mobile while keeping scrollability */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-sky-500 selection:text-white">

  <!-- Top Utility Bar -->
  <div class="bg-navy-950 text-slate-300 text-[11px] sm:text-xs py-1.5 px-4 border-b border-white/10">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="font-semibold text-white">MultiFix Home Solution &amp; Service Center</span>
        <span class="hidden sm:inline text-slate-400">| Doorstep Sales, Repair &amp; Scrap</span>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-cyan-300 font-semibold">&bull; Sales &bull; Service &bull; Scrap</span>
        <div class="hidden md:flex items-center gap-3 border-l border-white/15 pl-3">
          <a href="#contact-footer" aria-label="WhatsApp Channel" class="hover:text-emerald-400 transition"><i class="fa-brands fa-whatsapp"></i></a>
          <a href="#contact-footer" aria-label="YouTube" class="hover:text-red-400 transition"><i class="fa-brands fa-youtube"></i></a>
          <a href="#contact-footer" aria-label="Instagram" class="hover:text-pink-400 transition"><i class="fa-brands fa-instagram"></i></a>
          <a href="#contact-footer" aria-label="Facebook" class="hover:text-blue-400 transition"><i class="fa-brands fa-facebook"></i></a>
        </div>
      </div>
    </div>
  </div>

  <!-- STICKY NAVIGATION BAR -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Brand Logo -->
      <button onclick="switchPage('home')" class="flex items-center gap-2.5 text-left group focus:outline-none">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-sky-500 to-blue-700 flex items-center justify-center text-white font-display font-extrabold text-lg sm:text-xl shadow-lg group-hover:shadow-sky-500/30 transition">
          M
        </div>
        <div>
          <span class="block font-display font-extrabold text-base sm:text-lg text-navy-900 leading-none tracking-tight">MultiFix</span>
          <span class="block text-[9px] sm:text-[10px] font-bold uppercase tracking-wider text-slate-500 mt-0.5">Home Solution &amp; Service Center</span>
        </div>
      </button>

      <!-- Desktop Navigation Links -->
      <nav class="hidden lg:flex items-center gap-6 text-sm font-semibold text-slate-600">
        <button onclick="navigateToSection('home', 'top')" class="hover:text-sky-600 transition">Home</button>
        <button onclick="navigateToSection('home', 'about-section')" class="hover:text-sky-600 transition">About</button>
        <button onclick="navigateToSection('home', 'services-section')" class="hover:text-sky-600 transition">Services</button>
        <button onclick="navigateToSection('home', 'sales-section')" class="hover:text-sky-600 transition">Store</button>
        <button onclick="navigateToSection('home', 'scrap-section')" class="hover:text-sky-600 transition">Scrap</button>
        <button onclick="navigateToSection('home', 'videos-section')" class="hover:text-sky-600 transition">Videos</button>
        <button onclick="showAdminLogin()" class="bg-navy-900 text-white px-3 py-1.5 rounded-lg text-xs hover:bg-navy-800 transition">Admin</button>
        <a href="#contact-footer" class="hover:text-sky-600 transition">Contact</a>
      </nav>

      <!-- Right Actions -->
      <div class="flex items-center gap-2 sm:gap-3">
        <button id="nav-back-home-btn" onclick="switchPage('home')" class="hidden items-center gap-1.5 px-3 py-2 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100 text-xs font-bold transition">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Home</span>
        </button>

        <button onclick="openBookingPage()" class="inline-flex items-center gap-1.5 px-3.5 sm:px-5 py-2 sm:py-2.5 rounded-xl bg-gradient-to-r from-brandOrange-500 to-orange-600 hover:from-brandOrange-600 hover:to-orange-700 text-white font-bold text-xs sm:text-sm shadow-md transition">
          <i class="fa-regular fa-calendar-check"></i>
          <span>Book a Service</span>
        </button>

        <!-- Mobile Menu Toggle -->
        <button id="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Toggle Menu" class="lg:hidden p-2 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-100">
          <i class="fa-solid fa-bars text-base"></i>
        </button>
      </div>
    </div>

    <!-- Mobile Dropdown Navigation -->
    <div id="mobile-menu" class="hidden lg:hidden bg-white border-t border-slate-100 px-4 py-3 space-y-1.5 shadow-lg">
      <button onclick="navigateToSection('home', 'top'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm font-semibold text-slate-700 hover:bg-sky-50 hover:text-sky-600 transition">Home</button>
      <button onclick="navigateToSection('home', 'about-section'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm font-semibold text-slate-700 hover:bg-sky-50 hover:text-sky-600 transition">About</button>
      <button onclick="navigateToSection('home', 'services-section'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm font-semibold text-slate-700 hover:bg-sky-50 hover:text-sky-600 transition">Services</button>
      <button onclick="navigateToSection('home', 'sales-section'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm font-semibold text-slate-700 hover:bg-sky-50 hover:text-sky-600 transition">Store</button>
      <button onclick="navigateToSection('home', 'scrap-section'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm font-semibold text-slate-700 hover:bg-sky-50 hover:text-sky-600 transition">Scrap</button>
      <button onclick="navigateToSection('home', 'videos-section'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm font-semibold text-slate-700 hover:bg-sky-50 hover:text-sky-600 transition">Videos</button>
      <button onclick="openBookingPage(); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm font-bold text-orange-600 bg-orange-50">Dedicated Booking Page &rarr;</button>
      <a href="#contact-footer" onclick="toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm font-semibold text-slate-700 hover:bg-sky-50 hover:text-sky-600">Contact Us</a>
      <button onclick="showAdminLogin(); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm font-semibold bg-navy-900 text-white hover:bg-navy-800 transition">Admin Panel</button>
    </div>
  </header>
